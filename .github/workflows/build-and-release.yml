name: Build and Release iMCord

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Vencord Dependencies
        working-directory: Vencord-main
        run: pnpm install --no-frozen-lockfile

      - name: Build Standalone Vencord
        working-directory: Vencord-main
        run: node scripts/build/build.mjs --standalone

      - name: Compile Standalone Installers (CLI & GUI)
        shell: cmd
        run: call installer_src\build_installers.bat

      - name: Generate Release Manifest & Detect Changed Assets
        run: node scripts/generate_manifest.mjs

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=iMCord ${{ github.ref_name }}" >> $GITHUB_ENV
          else
            TAG="v1.0.${{ github.run_number }}"
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV
            echo "RELEASE_NAME=iMCord $TAG" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
