name: Auto Update Plugin Manifest

on:
  push:
    paths:
      - 'userplugins/**.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Manifest Generator
        run: node scripts/generate-manifest.mjs

      - name: Commit Updated Manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add userplugins/manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update userplugins manifest [skip ci]" && git push)
